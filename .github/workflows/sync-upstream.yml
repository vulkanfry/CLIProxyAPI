name: Sync upstream

on:
  schedule:
    # Daily 06:17 UTC
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Also allow manual re-run after upstream releases

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main-xai-codex
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git || true
          git remote set-url upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream --tags
          git fetch origin

      - name: Fast-forward main from upstream
        run: |
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git reset --hard upstream/main
          git push origin main

      - name: Rebase patch branch onto upstream/main
        id: rebase
        run: |
          set -euo pipefail
          git checkout -B main-xai-codex origin/main-xai-codex
          # Remember our patch tip before rebase
          BEFORE=$(git rev-parse HEAD)
          if git rebase upstream/main; then
            echo "rebased=true" >> "$GITHUB_OUTPUT"
            git push origin main-xai-codex --force-with-lease
            AFTER=$(git rev-parse HEAD)
            echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "after=$AFTER" >> "$GITHUB_OUTPUT"
            if [ "$BEFORE" != "$AFTER" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "rebased=false" >> "$GITHUB_OUTPUT"
            git rebase --abort || true
            # Open/update an issue so conflicts are visible
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Report rebase conflict
        if: steps.rebase.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'upstream sync conflict on main-xai-codex';
            const body = [
              'Automatic rebase of `main-xai-codex` onto `router-for-me/CLIProxyAPI@main` failed.',
              '',
              'Manual steps:',
              '```bash',
              'git fetch upstream',
              'git checkout main-xai-codex',
              'git rebase upstream/main',
              '# resolve conflicts, then:',
              'git push origin main-xai-codex --force-with-lease',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 10,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              // label may not exist yet; create issue without hard dependency on labels
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['upstream-sync'],
                });
              } catch (e) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            }

      - name: Summary
        run: |
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- main: fast-forwarded from upstream/main" >> "$GITHUB_STEP_SUMMARY"
          echo "- main-xai-codex rebased: ${{ steps.rebase.outputs.rebased }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- changed: ${{ steps.rebase.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- conflict: ${{ steps.rebase.outputs.conflict }}" >> "$GITHUB_STEP_SUMMARY"
